<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteRush — Your Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================================
           BITERUSH CART PAGE
           All styles are scoped with br-cart-
        ========================================================= */

        .br-cart-page {
            min-height: 100vh;
            width: 100%;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(124, 58, 237, 0.16),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 10% 35%,
                    rgba(37, 99, 235, 0.08),
                    transparent 25%
                ),
                #050508;

            color: #ffffff;
            font-family: "Inter", sans-serif;

            overflow-x: hidden;
        }

        .br-cart-page *,
        .br-cart-page *::before,
        .br-cart-page *::after {
            box-sizing: border-box;
        }

        /* ================= HEADER ================= */

        .br-cart-header {
            width: 100%;
            min-height: 78px;

            padding: 0 42px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 5, 8, 0.88);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            position: sticky;
            top: 0;
            z-index: 100;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .br-cart-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .br-cart-back {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #101017;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            color: #ffffff;

            font-size: 20px;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .br-cart-back:hover {
            transform: translateX(-3px);

            border-color:
                rgba(139, 92, 246, 0.55);

            background: #171322;
        }

        .br-cart-brand {
            font-family: "Poppins", sans-serif;

            font-size: 21px;
            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .br-cart-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .br-cart-brand-logo {
            width: 34px;
            height: 34px;
            object-fit: contain;
            display: block;
            border-radius: 9px;
        }

        .br-cart-brand span {
            color: #a78bfa;
        }

        .br-cart-header-title {
            font-size: 14px;
            color: #777786;
            font-weight: 600;
        }

        /* ================= MAIN ================= */

        .br-cart-main {
            width: 100%;

            padding:
                40px 42px 120px;
        }

        .br-cart-heading {
            margin-bottom: 30px;
        }

        .br-cart-heading h1 {
            margin: 0;

            font-family: "Poppins", sans-serif;

            font-size:
                clamp(34px, 4vw, 52px);

            line-height: 1.05;

            letter-spacing: -1.7px;

            font-weight: 800;
        }

        .br-cart-heading p {
            margin: 10px 0 0;

            color: #858594;

            font-size: 14px;
        }

        /* ================= LAYOUT ================= */

        .br-cart-layout {
            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(350px, 0.42fr);

            gap: 28px;

            align-items: start;
        }

        /* ================= CART ITEMS PANEL ================= */

        .br-cart-items-panel {
            min-width: 0;

            padding: 22px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 18, 27, 0.98),
                    rgba(10, 10, 16, 0.98)
                );

            border:
                1px solid rgba(255, 255, 255, 0.07);

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.25);
        }

        .br-cart-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding-bottom: 18px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);

            margin-bottom: 18px;
        }

        .br-cart-panel-title {
            margin: 0;

            font-family: "Poppins", sans-serif;

            font-size: 20px;
            font-weight: 700;
        }

        .br-cart-item-count-label {
            color: #777786;

            font-size: 12px;
            font-weight: 600;
        }

        /* ================= CART ITEM ================= */

        .br-cart-item {
            display: grid;

            grid-template-columns:
                105px
                minmax(0, 1fr)
                auto;

            gap: 18px;

            align-items: center;

            padding: 17px 0;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.06);
        }

        .br-cart-item:last-child {
            border-bottom: none;
        }

        .br-cart-item-image {
            width: 105px;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 58, 237, 0.14),
                    transparent 65%
                ),
                #0b0b12;

            border:
                1px solid rgba(255, 255, 255, 0.06);

            font-size: 55px;

            overflow: hidden;
        }

        .br-cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 17px;
        }

        .br-cart-item-image > span {
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .br-cart-item-info {
            min-width: 0;
        }

        .br-cart-item-category {
            margin-top: 4px;
            color: #777786;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .br-cart-item-name {
            margin: 0;

            font-family: "Poppins", sans-serif;

            color: #ffffff;

            font-size: 17px;
            font-weight: 700;
        }

        .br-cart-item-price {
            margin-top: 6px;

            color: #a78bfa;

            font-size: 14px;
            font-weight: 700;
        }

        .br-cart-item-instructions {
            margin-top: 8px;

            color: #666674;

            font-size: 11px;
            line-height: 1.45;

            max-width: 600px;
        }

        .br-cart-item-controls {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-top: 14px;
        }

        .br-cart-quantity {
            display: flex;
            align-items: center;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 11px;

            background: #0b0b11;

            overflow: hidden;
        }

        .br-cart-quantity button {
            width: 32px;
            height: 32px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .br-cart-quantity button:hover {
            background:
                rgba(124, 58, 237, 0.20);

            color: #c4b5fd;
        }

        .br-cart-quantity-value {
            min-width: 30px;

            text-align: center;

            color: #ffffff;

            font-size: 12px;
            font-weight: 800;
        }

        .br-cart-remove {
            padding: 8px 10px;

            border-radius: 9px;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            background: transparent;

            color: #777786;

            font-family: inherit;

            font-size: 11px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .br-cart-remove:hover {
            color: #ffffff;

            border-color:
                rgba(167, 139, 250, 0.35);

            background:
                rgba(124, 58, 237, 0.10);
        }

        .br-cart-item-total {
            align-self: center;

            color: #ffffff;

            font-size: 17px;
            font-weight: 800;

            white-space: nowrap;
        }

        /* ================= EMPTY CART ================= */

        .br-cart-empty {
            display: none;

            min-height: 390px;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 40px;
        }

        .br-cart-empty.show {
            display: flex;
        }

        .br-cart-empty-icon {
            width: 90px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background:
                rgba(124, 58, 237, 0.10);

            border:
                1px solid rgba(167, 139, 250, 0.15);

            margin-bottom: 20px;
            overflow: hidden;
        }

        .br-cart-empty-icon img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .br-cart-empty h2 {
            margin: 0;

            font-family: "Poppins", sans-serif;

            font-size: 24px;
        }

        .br-cart-empty p {
            margin: 9px 0 22px;

            color: #777786;

            font-size: 13px;
        }

        .br-cart-browse-btn {
            min-height: 45px;

            padding: 0 18px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .br-cart-browse-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(124, 58, 237, 0.22);
        }

        /* ================= SUMMARY ================= */

        .br-cart-summary {
            position: sticky;
            top: 100px;

            padding: 24px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #13131e,
                    #0b0b12
                );

            border:
                1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.28);
        }

        .br-cart-summary-title {
            margin: 0;

            font-family: "Poppins", sans-serif;

            font-size: 21px;
            font-weight: 800;
        }

        .br-cart-summary-subtitle {
            margin: 6px 0 22px;

            color: #777786;

            font-size: 12px;
        }

        /* ================= PROMO ================= */

        .br-cart-promo {
            margin-bottom: 22px;
        }

        .br-cart-promo-label {
            display: block;

            margin-bottom: 9px;

            color: #aaaaba;

            font-size: 12px;
            font-weight: 700;
        }

        .br-cart-promo-row {
            display: flex;
            gap: 8px;
        }

        .br-cart-promo-input {
            flex: 1;

            min-width: 0;

            height: 43px;

            padding: 0 12px;

            border-radius: 11px;

            outline: none;

            background: #09090f;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            color: #ffffff;

            font-family: inherit;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .br-cart-promo-input::placeholder {
            color: #565663;
        }

        .br-cart-promo-input:focus {
            border-color:
                rgba(139, 92, 246, 0.55);
        }

        .br-cart-promo-button {
            height: 43px;

            padding: 0 14px;

            border: none;

            border-radius: 11px;

            background:
                rgba(124, 58, 237, 0.18);

            border:
                1px solid rgba(167, 139, 250, 0.18);

            color: #c4b5fd;

            font-family: inherit;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .br-cart-promo-button:hover {
            background:
                rgba(124, 58, 237, 0.28);
        }

        .br-cart-promo-message {
            display: none;

            margin-top: 8px;

            font-size: 11px;
            line-height: 1.4;
        }

        .br-cart-promo-message.show {
            display: block;
        }

        .br-cart-promo-message.success {
            color: #c4b5fd;
        }

        .br-cart-promo-message.error {
            color: #fca5a5;
        }

        /* ================= SUMMARY ROWS ================= */

        .br-cart-summary-divider {
            width: 100%;
            height: 1px;

            margin: 19px 0;

            background:
                rgba(255, 255, 255, 0.07);
        }

        .br-cart-summary-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 13px;

            color: #9b9baa;

            font-size: 13px;
        }

        .br-cart-summary-row strong {
            color: #ffffff;
            font-weight: 700;
        }

        .br-cart-summary-label-with-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .br-cart-summary-label-icon {
            width: 19px;
            height: 19px;
            object-fit: contain;
            opacity: 0.9;
        }

        .br-cart-secure img {
            width: 17px;
            height: 17px;
            object-fit: contain;
            opacity: 0.75;
        }

        .br-cart-discount {
            color: #c4b5fd !important;
        }

        .br-cart-delivery-free {
            color: #c4b5fd !important;
        }

        .br-cart-total-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-top: 3px;
        }

        .br-cart-total-label {
            color: #ffffff;

            font-size: 16px;
            font-weight: 800;
        }

        .br-cart-total-value {
            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 25px;
            font-weight: 800;
        }

        /* ================= CHECKOUT ================= */

        .br-cart-checkout {
            width: 100%;

            min-height: 53px;

            margin-top: 23px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 13px 30px
                rgba(124, 58, 237, 0.22);

            transition: 0.2s ease;
        }

        .br-cart-checkout:hover {
            transform: translateY(-2px);

            box-shadow:
                0 17px 35px
                rgba(124, 58, 237, 0.30);
        }

        .br-cart-continue {
            width: 100%;

            margin-top: 12px;

            min-height: 42px;

            border: none;

            background: transparent;

            color: #858594;

            font-family: inherit;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .br-cart-continue:hover {
            color: #c4b5fd;
        }

        /* ================= SECURITY ================= */

        .br-cart-secure {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: #5f5f6d;

            font-size: 10px;
        }

        /* ================= TOAST ================= */

        .br-cart-toast {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform:
                translate(-50%, 20px);

            padding: 13px 18px;

            border-radius: 13px;

            background: #171722;

            border:
                1px solid
                rgba(167, 139, 250, 0.25);

            color: #ffffff;

            font-size: 13px;
            font-weight: 600;

            opacity: 0;

            pointer-events: none;

            transition: 0.3s ease;

            z-index: 300;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.45);
        }

        .br-cart-toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1100px) {

            .br-cart-layout {
                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(310px, 0.45fr);
            }

        }

        @media (max-width: 900px) {

            .br-cart-header {
                padding: 0 24px;
            }

            .br-cart-main {
                padding-left: 24px;
                padding-right: 24px;
            }

            .br-cart-layout {
                grid-template-columns: 1fr;
            }

            .br-cart-summary {
                position: static;
            }

        }

        @media (max-width: 600px) {

            .br-cart-header {
                min-height: 70px;
                padding: 0 16px;
            }

            .br-cart-brand {
                font-size: 19px;
            }

            .br-cart-header-title {
                display: none;
            }

            .br-cart-main {
                padding:
                    24px 16px 80px;
            }

            .br-cart-heading h1 {
                font-size: 37px;
            }

            .br-cart-items-panel,
            .br-cart-summary {
                padding: 17px;
                border-radius: 21px;
            }

            .br-cart-item {
                grid-template-columns:
                    78px minmax(0, 1fr);

                gap: 13px;
            }

            .br-cart-item-image {
                width: 78px;
                height: 78px;

                font-size: 40px;
            }

            .br-cart-item-name {
                font-size: 14px;
            }

            .br-cart-item-price {
                font-size: 12px;
            }

            .br-cart-item-total {
                grid-column: 2;
                justify-self: end;

                margin-top: -8px;

                font-size: 15px;
            }

            .br-cart-panel-title {
                font-size: 18px;
            }

            .br-cart-summary-title {
                font-size: 19px;
            }

        }
    </style>
</head>

<body>

<div class="br-cart-page">

    <!-- ================= HEADER ================= -->

    <header class="br-cart-header">

        <div class="br-cart-header-left">

            <button
                class="br-cart-back"
                onclick="goBack()"
                aria-label="Go back"
            >
                ←
            </button>

            <div class="br-cart-brand">
                <img
                    class="br-cart-brand-logo"
                    src="../assets/logo/biterush-logo.png"
                    alt="BiteRush logo"
                >
                <span>BiteRush</span>
            </div>

            <div class="br-cart-header-title">
                Shopping Cart
            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="br-cart-main">

        <div class="br-cart-heading">

            <h1>
                Your Cart
            </h1>

            <p id="brCartHeadingText">
                Review your items before checkout.
            </p>

        </div>


        <div class="br-cart-layout">


            <!-- ================= ITEMS ================= -->

            <section class="br-cart-items-panel">

                <div
                    class="br-cart-panel-header"
                    id="brCartPanelHeader"
                >

                    <h2 class="br-cart-panel-title">
                        Order Items
                    </h2>

                    <span
                        class="br-cart-item-count-label"
                        id="brCartItemCountLabel"
                    >
                        0 items
                    </span>

                </div>


                <div
                    id="brCartItems"
                ></div>


                <!-- EMPTY CART -->

                <div
                    class="br-cart-empty"
                    id="brCartEmpty"
                >

                    <div class="br-cart-empty-icon">
                        <img
                            src="../assets/icons/cart.png"
                            alt="Shopping cart"
                        >
                    </div>

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        Looks like you haven't added anything yet.
                    </p>

                    <button
                        class="br-cart-browse-btn"
                        onclick="continueShopping()"
                    >
                        Browse Restaurants →
                    </button>

                </div>

            </section>


            <!-- ================= SUMMARY ================= -->

            <aside
                class="br-cart-summary"
                id="brCartSummary"
            >

                <h2 class="br-cart-summary-title">
                    Order Summary
                </h2>

                <p class="br-cart-summary-subtitle">
                    Your final order total
                </p>


                <!-- PROMO -->

                <div class="br-cart-promo">

                    <label
                        class="br-cart-promo-label"
                        for="brCartPromoInput"
                    >
                        Have a promo code?
                    </label>

                    <div class="br-cart-promo-row">

                        <input
                            type="text"
                            id="brCartPromoInput"
                            class="br-cart-promo-input"
                            placeholder="Enter code"
                            autocomplete="off"
                        >

                        <button
                            class="br-cart-promo-button"
                            onclick="applyPromo()"
                        >
                            Apply
                        </button>

                    </div>

                    <div
                        class="br-cart-promo-message"
                        id="brCartPromoMessage"
                    ></div>

                </div>


                <div class="br-cart-summary-divider"></div>


                <!-- SUBTOTAL -->

                <div class="br-cart-summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="brCartSubtotal">
                        ₹0
                    </strong>

                </div>


                <!-- DELIVERY -->

                <div class="br-cart-summary-row">

                    <span class="br-cart-summary-label-with-icon">
                        <img
                            class="br-cart-summary-label-icon"
                            src="../assets/icons/delivery.png"
                            alt=""
                        >
                        Delivery Fee
                    </span>

                    <strong id="brCartDelivery">
                        ₹40
                    </strong>

                </div>


                <!-- DISCOUNT -->

                <div
                    class="br-cart-summary-row"
                    id="brCartDiscountRow"
                    style="display:none;"
                >

                    <span>
                        Discount
                    </span>

                    <strong
                        class="br-cart-discount"
                        id="brCartDiscount"
                    >
                        -₹0
                    </strong>

                </div>


                <div class="br-cart-summary-divider"></div>


                <!-- TOTAL -->

                <div class="br-cart-total-row">

                    <span class="br-cart-total-label">
                        Total
                    </span>

                    <span
                        class="br-cart-total-value"
                        id="brCartTotal"
                    >
                        ₹0
                    </span>

                </div>


                <!-- CHECKOUT -->

                <button
                    class="br-cart-checkout"
                    id="brCartCheckout"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout →
                </button>


                <button
                    class="br-cart-continue"
                    onclick="continueShopping()"
                >
                    ← Continue Shopping
                </button>


                <div class="br-cart-secure">
                    <img
                        src="../assets/icons/payment.png"
                        alt=""
                    >
                    Secure checkout • Your information is protected
                </div>

            </aside>

        </div>

    </main>


    <!-- ================= TOAST ================= -->

    <div
        class="br-cart-toast"
        id="brCartToast"
    ></div>

</div>


<script>

    /* =========================================================
       BITERUSH CART JAVASCRIPT
    ========================================================= */


    let brCartDiscount = 0;


    /* ================= CART DATA ================= */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "biteRushCart"
                )
            ) || [];

        } catch {

            return [];

        }

    }


    function saveCart(cart) {

        localStorage.setItem(
            "biteRushCart",
            JSON.stringify(cart)
        );

    }


    /* ================= CALCULATIONS ================= */

    function getSubtotal(cart) {

        return cart.reduce(
            (total, item) => {

                return total +
                    (
                        Number(item.price || 0) *
                        Number(item.quantity || 0)
                    );

            },
            0
        );

    }


    function getItemCount(cart) {

        return cart.reduce(
            (total, item) => {

                return total +
                    Number(item.quantity || 0);

            },
            0
        );

    }


    function getDeliveryFee(subtotal) {

        if (subtotal <= 0) {
            return 0;
        }

        return subtotal > 499
            ? 0
            : 40;

    }


    /* ================= RENDER ================= */

    function renderCart() {

        const cart =
            getCart();


        const itemsContainer =
            document.getElementById(
                "brCartItems"
            );


        const emptyState =
            document.getElementById(
                "brCartEmpty"
            );


        const summary =
            document.getElementById(
                "brCartSummary"
            );


        const panelHeader =
            document.getElementById(
                "brCartPanelHeader"
            );


        const count =
            getItemCount(cart);


        const subtotal =
            getSubtotal(cart);


        const deliveryFee =
            getDeliveryFee(subtotal);


        if (cart.length === 0) {

            itemsContainer.innerHTML = "";

            emptyState.classList.add(
                "show"
            );

            summary.style.display =
                "none";

            panelHeader.style.display =
                "none";

            document.getElementById(
                "brCartHeadingText"
            ).textContent =
                "Your cart is waiting for something delicious.";

            return;

        }


        emptyState.classList.remove(
            "show"
        );


        summary.style.display =
            "";


        panelHeader.style.display =
            "";


        document.getElementById(
            "brCartHeadingText"
        ).textContent =
            "Review your items before checkout.";


        document.getElementById(
            "brCartItemCountLabel"
        ).textContent =
            `${count} item${count === 1 ? "" : "s"}`;


        itemsContainer.innerHTML =
            cart.map(
                (item, index) =>
                    createCartItemHTML(
                        item,
                        index
                    )
            ).join("");


        updateSummary();

    }


    /* ================= CART ITEM HTML ================= */

    function resolveCartImage(image) {

        if (!image) {
            return "";
        }

        const value = String(image).trim();

        if (!value) {
            return "";
        }

        if (
            value.startsWith("http://") ||
            value.startsWith("https://") ||
            value.startsWith("data:")
        ) {
            return value;
        }

        if (value.startsWith("../") || value.startsWith("./")) {
            return value;
        }

        if (value.startsWith("/")) {
            return value;
        }

        if (value.includes("assets/")) {
            return "../" + value.substring(value.indexOf("assets/"));
        }

        return "../assets/images/food/" + value;
    }


    function createCartItemHTML(item, index) {

        const itemTotal =
            Number(item.price || 0) *
            Number(item.quantity || 0);

        const imagePath =
            resolveCartImage(item.image);

        const itemImageHTML =
            imagePath
                ? `
                    <img
                        src="${escapeHTML(imagePath)}"
                        alt="${escapeHTML(item.name || "Food item")}"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    >
                    <span style="display:none;">
                        ${item.emoji || "🍽️"}
                    </span>
                `
                : `
                    <span>
                        ${item.emoji || "🍽️"}
                    </span>
                `;


        const instructions =
            item.instructions &&
            item.instructions.trim()
                ? `
                    <div class="br-cart-item-instructions">
                        📝 ${escapeHTML(item.instructions)}
                    </div>
                `
                : "";


        const category =
            item.category
                ? `
                    <div class="br-cart-item-category">
                        ${escapeHTML(item.category)}
                    </div>
                `
                : "";


        return `

            <article class="br-cart-item">

                <div class="br-cart-item-image">
                    ${itemImageHTML}
                </div>


                <div class="br-cart-item-info">

                    <h3 class="br-cart-item-name">
                        ${escapeHTML(item.name)}
                    </h3>

                    ${category}

                    <div class="br-cart-item-price">
                        ₹${Number(item.price || 0)} each
                    </div>

                    ${instructions}


                    <div class="br-cart-item-controls">

                        <div class="br-cart-quantity">

                            <button
                                onclick="changeCartQuantity(${index}, -1)"
                                aria-label="Decrease quantity"
                            >
                                −
                            </button>

                            <span class="br-cart-quantity-value">
                                ${Number(item.quantity || 0)}
                            </span>

                            <button
                                onclick="changeCartQuantity(${index}, 1)"
                                aria-label="Increase quantity"
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="br-cart-remove"
                            onclick="removeCartItem(${index})"
                        >
                            Remove
                        </button>

                    </div>

                </div>


                <div class="br-cart-item-total">
                    ₹${itemTotal}
                </div>

            </article>

        `;

    }


    /* ================= QUANTITY ================= */

    function changeCartQuantity(index, amount) {

        const cart =
            getCart();


        if (!cart[index]) {
            return;
        }


        cart[index].quantity =
            Number(cart[index].quantity || 0) +
            amount;


        if (
            cart[index].quantity <= 0
        ) {

            cart.splice(
                index,
                1
            );

        }


        saveCart(cart);

        renderCart();

        showCartToast(
            "Cart updated"
        );

    }


    /* ================= REMOVE ================= */

    function removeCartItem(index) {

        const cart =
            getCart();


        if (!cart[index]) {
            return;
        }


        const removedName =
            cart[index].name;


        cart.splice(
            index,
            1
        );


        saveCart(cart);


        renderCart();


        showCartToast(
            `${removedName} removed from cart`
        );

    }


    /* ================= PROMO ================= */

    function applyPromo() {

        const input =
            document.getElementById(
                "brCartPromoInput"
            );


        const message =
            document.getElementById(
                "brCartPromoMessage"
            );


        const code =
            input.value
                .trim()
                .toUpperCase();


        const cart =
            getCart();


        const subtotal =
            getSubtotal(cart);


        if (!code) {

            brCartDiscount = 0;

            localStorage.removeItem(
                "biteRushDiscount"
            );


            message.textContent =
                "Please enter a promo code.";

            message.className =
                "br-cart-promo-message show error";


            updateSummary();

            return;

        }


        if (
            code === "BITERUSH50"
        ) {

            if (subtotal >= 200) {

                brCartDiscount =
                    Math.round(
                        subtotal * 0.50
                    );


                localStorage.setItem(
                    "biteRushDiscount",
                    String(brCartDiscount)
                );


                message.textContent =
                    "50% discount applied successfully 🎉";

                message.className =
                    "br-cart-promo-message show success";


                showCartToast(
                    "Promo code applied 🎉"
                );


                updateSummary();

            }
            else {

                brCartDiscount = 0;


                localStorage.removeItem(
                    "biteRushDiscount"
                );


                message.textContent =
                    "Minimum order value of ₹200 is required.";

                message.className =
                    "br-cart-promo-message show error";


                updateSummary();

            }

        }
        else {

            brCartDiscount = 0;


            localStorage.removeItem(
                "biteRushDiscount"
            );


            message.textContent =
                "Invalid promo code. Try BITERUSH50.";

            message.className =
                "br-cart-promo-message show error";


            updateSummary();

        }

    }


    /* ================= LOAD DISCOUNT ================= */

    function loadSavedDiscount() {

        const savedDiscount =
            Number(
                localStorage.getItem(
                    "biteRushDiscount"
                )
            );


        if (
            Number.isFinite(savedDiscount) &&
            savedDiscount > 0
        ) {

            brCartDiscount =
                savedDiscount;

        }

    }


    /* ================= UPDATE SUMMARY ================= */

    function updateSummary() {

        const cart =
            getCart();


        const subtotal =
            getSubtotal(cart);


        const deliveryFee =
            getDeliveryFee(subtotal);


        const discount =
            Math.min(
                brCartDiscount,
                subtotal
            );


        const total =
            Math.max(
                0,
                subtotal +
                deliveryFee -
                discount
            );


        document.getElementById(
            "brCartSubtotal"
        ).textContent =
            `₹${subtotal}`;


        const deliveryElement =
            document.getElementById(
                "brCartDelivery"
            );


        if (
            subtotal > 499
        ) {

            deliveryElement.textContent =
                "FREE";

            deliveryElement.classList.add(
                "br-cart-delivery-free"
            );

        }
        else {

            deliveryElement.textContent =
                `₹${deliveryFee}`;

            deliveryElement.classList.remove(
                "br-cart-delivery-free"
            );

        }


        const discountRow =
            document.getElementById(
                "brCartDiscountRow"
            );


        const discountElement =
            document.getElementById(
                "brCartDiscount"
            );


        if (
            discount > 0
        ) {

            discountRow.style.display =
                "flex";

            discountElement.textContent =
                `-₹${discount}`;

        }
        else {

            discountRow.style.display =
                "none";

        }


        document.getElementById(
            "brCartTotal"
        ).textContent =
            `₹${total}`;


        const checkoutButton =
            document.getElementById(
                "brCartCheckout"
            );


        checkoutButton.disabled =
            cart.length === 0;

    }


    /* ================= CHECKOUT ================= */

    function proceedToCheckout() {

        const cart =
            getCart();


        if (
            cart.length === 0
        ) {

            showCartToast(
                "Your cart is empty."
            );

            return;

        }


        const subtotal =
            getSubtotal(cart);


        if (
            subtotal <= 0
        ) {

            showCartToast(
                "Please add an item first."
            );

            return;

        }


        window.location.href =
            "checkout.html";

    }


    /* ================= NAVIGATION ================= */

    function continueShopping() {

        window.location.href =
            "home.html";

    }


    function goBack() {

        if (
            document.referrer &&
            (
                document.referrer.includes(
                    "menu-item.html"
                ) ||
                document.referrer.includes(
                    "restaurant.html"
                ) ||
                document.referrer.includes(
                    "home.html"
                )
            )
        ) {

            window.history.back();

        }
        else {

            window.location.href =
                "home.html";

        }

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ================= TOAST ================= */

    let brCartToastTimer;


    function showCartToast(message) {

        const toast =
            document.getElementById(
                "brCartToast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            brCartToastTimer
        );


        brCartToastTimer =
            setTimeout(
                function () {

                    toast.classList.remove(
                        "show"
                    );

                },
                2200
            );

    }


    /* ================= INITIALIZE ================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadSavedDiscount();

            renderCart();

        }
    );

</script>

</body>
</html>
